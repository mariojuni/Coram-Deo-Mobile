name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Set Environment variables for Production
        if: github.ref == 'refs/heads/main'
        run: |
          echo "EXPO_PUBLIC_APP_ENV=production" >> $GITHUB_ENV
          # echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.PROD_FIREBASE_API_KEY }}" >> $GITHUB_ENV
          
      - name: Set Environment variables for Staging
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "EXPO_PUBLIC_APP_ENV=staging" >> $GITHUB_ENV
          
      - name: Build Web
        run: npx expo export -p web
        
      - name: Deploy to Firebase Hosting (Production)
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHURCH_APP_PRODUCTION }}'
          projectId: church-app-production
          channelId: live
          
      - name: Deploy to Firebase Hosting (Staging)
        if: github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHURCH_APP_STAGING }}'
          projectId: church-app-staging
          channelId: live
