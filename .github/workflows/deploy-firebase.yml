name: Deploy Firebase Configuration

on:
  workflow_dispatch:

jobs:
  deploy_staging:
    name: Deploy to Staging Firebase
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create SA key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: echo "$SA_KEY" > sa-key.json

      - name: Deploy to Staging
        run: firebase deploy --only firestore --project nazarenechurch-9c030 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa-key.json

  deploy_production:
    name: Deploy to Production Firebase
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create SA key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
        run: echo "$SA_KEY" > sa-key.json

      - name: Deploy to Production
        run: firebase deploy --only firestore --project coramdeo-prod --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa-key.json
