name: Distribute Staging App to Firebase Testers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - ios
          - android

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-staging:
    if: github.event.inputs.platform == 'both' || github.event.inputs.platform == 'android'
    name: Build and Distribute Android Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p fastlane
          echo "$KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > fastlane/staging-upload-key.keystore

      - name: Create Firebase Service Account JSON
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          mkdir -p fastlane
          echo "$SERVICE_ACCOUNT" > fastlane/service-account.json

      - name: Inject google-services.json (Staging)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_STAGING }}
        run: |
          mkdir -p credentials/staging
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > credentials/staging/google-services.json

      - name: Run Fastlane Android
        env:
          FIREBASE_ANDROID_APP_ID_STAGING: ${{ secrets.FIREBASE_ANDROID_APP_ID_STAGING }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_TESTER_GROUPS: "coram-deo-tester"
        run: |
          EXPO_PUBLIC_APP_ENV=development npx expo prebuild --platform android --clean
          bundle exec fastlane android staging
          
      - name: Cleanup Keystore and Service Account
        if: always()
        run: |
          rm -f fastlane/staging-upload-key.keystore
          rm -f fastlane/service-account.json

  ios-staging:
    if: github.event.inputs.platform == 'both' || github.event.inputs.platform == 'ios'
    name: Build and Distribute iOS Staging
    runs-on: macos-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          

      - name: Create Firebase Service Account JSON
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          mkdir -p fastlane
          echo "$SERVICE_ACCOUNT" > fastlane/service-account.json

      - name: Inject GoogleService-Info.plist (Staging)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_STAGING }}
        run: |
          mkdir -p credentials/staging
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > credentials/staging/GoogleService-Info.plist

      - name: Run Fastlane iOS
        env:
          FIREBASE_IOS_APP_ID_STAGING: ${{ secrets.FIREBASE_IOS_APP_ID_STAGING }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FIREBASE_TESTER_GROUPS: "coram-deo-tester"
        run: |
          EXPO_PUBLIC_APP_ENV=development npx expo prebuild --platform ios --clean
          CLEAN_URL=$(echo "${{ secrets.MATCH_GIT_URL }}" | tr -d "'\"\r\n ")
          export MATCH_GIT_URL="$CLEAN_URL"
          RAW_AUTH="${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}"
          CLEAN_AUTH=$(echo "$RAW_AUTH" | tr -d '\r\n ' | sed 's/^Basic//I')
          if [ -n "$CLEAN_AUTH" ]; then
            export MATCH_GIT_BASIC_AUTHORIZATION="$CLEAN_AUTH"
          else
            unset MATCH_GIT_BASIC_AUTHORIZATION
          fi
          bundle exec fastlane ios staging

      - name: Cleanup Service Account
        if: always()
        run: rm -f fastlane/service-account.json

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [android-staging, ios-staging]
    if: always() && (needs.android-staging.result == 'success' || needs.ios-staging.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and push release tag
        run: |
          TAG="staging-build-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Staging build #${{ github.run_number }} from ${{ github.ref_name }} (commit: ${{ github.sha }})"
          git push origin "$TAG"
          echo "✅ Tagged release as: $TAG"
