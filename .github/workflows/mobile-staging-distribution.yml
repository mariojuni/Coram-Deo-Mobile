name: Distribute Staging App to Firebase Testers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - ios
          - android
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-staging:
    if: github.event.inputs.platform == 'both' || github.event.inputs.platform == 'android'
    name: Build and Distribute Android Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p fastlane
          echo "$KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > fastlane/staging-upload-key.keystore

      - name: Create Firebase Service Account JSON
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          mkdir -p fastlane
          echo "$SERVICE_ACCOUNT" > fastlane/service-account.json

      - name: Inject google-services.json (Staging)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_STAGING }}
        run: |
          mkdir -p credentials/staging
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > credentials/staging/google-services.json

      - name: Run Build and Fastlane Android
        env:
          FIREBASE_ANDROID_APP_ID_STAGING: ${{ secrets.FIREBASE_ANDROID_APP_ID_STAGING }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_TESTER_GROUPS: "coram-deo-tester"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          EXPO_PUBLIC_APP_ENV=development npx expo prebuild --platform android --clean
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties
          
          cd android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=../fastlane/staging-upload-key.keystore -Pandroid.injected.signing.store.password=${ANDROID_KEYSTORE_PASSWORD} -Pandroid.injected.signing.key.alias=${ANDROID_KEY_ALIAS} -Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD} --stacktrace --console=plain > build_log.txt 2>&1 || { tail -n 250 build_log.txt; echo "❌ GRADLE BUILD FAILED. Check the lines above for the exact Caused by: error."; exit 1; }
          cd ..
          
          bundle exec fastlane android staging_upload
          
      - name: Cleanup Keystore and Service Account
        if: always()
        run: |
          rm -f fastlane/staging-upload-key.keystore
          rm -f fastlane/service-account.json

  ios-staging:
    if: github.event.inputs.platform == 'both' || github.event.inputs.platform == 'ios'
    name: Build and Distribute iOS Staging
    runs-on: macos-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          

      - name: Create Firebase Service Account JSON
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          mkdir -p fastlane
          echo "$SERVICE_ACCOUNT" > fastlane/service-account.json

      - name: Inject GoogleService-Info.plist (Staging)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_STAGING }}
        run: |
          mkdir -p credentials/staging
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | tr -d '\n\r' | base64 --decode > credentials/staging/GoogleService-Info.plist

      - name: Run Fastlane iOS
        env:
          FIREBASE_IOS_APP_ID_STAGING: ${{ secrets.FIREBASE_IOS_APP_ID_STAGING }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FIREBASE_TESTER_GROUPS: "coram-deo-tester"
        run: |
          EXPO_PUBLIC_APP_ENV=development npx expo prebuild --platform ios --clean
          CLEAN_URL=$(echo "${{ secrets.MATCH_GIT_URL }}" | tr -d "'\"\r\n ")
          export MATCH_GIT_URL="$CLEAN_URL"
          RAW_AUTH="${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}"
          CLEAN_AUTH=$(echo "$RAW_AUTH" | tr -d '\r\n ' | sed 's/^Basic//I')
          if [ -n "$CLEAN_AUTH" ]; then
            export MATCH_GIT_BASIC_AUTHORIZATION="$CLEAN_AUTH"
          else
            unset MATCH_GIT_BASIC_AUTHORIZATION
          fi
          bundle exec fastlane ios staging

      - name: Cleanup Service Account
        if: always()
        run: rm -f fastlane/service-account.json

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [android-staging, ios-staging]
    if: always() && (needs.android-staging.result == 'success' || needs.ios-staging.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version and tag
        run: |
          # Get the latest semver tag (e.g. v1.2.3), default to v0.0.0
          LATEST=$(git tag -l 'v*.*.*' | sort -V | tail -n 1)
          LATEST=${LATEST:-v0.0.0}
          echo "Latest tag: $LATEST"

          # Strip the 'v' prefix and split into parts
          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Bump the correct number based on input
          BUMP="${{ github.event.inputs.version_bump }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG — $BUMP bump from ${{ github.ref_name }} (build #${{ github.run_number }}, commit: ${{ github.sha }})"
          git push origin "$NEW_TAG"
          echo "✅ Tagged release as: $NEW_TAG"
